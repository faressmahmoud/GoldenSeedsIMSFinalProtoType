name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Explicit permissions disable the rest; `actions: write` is required for
# `upload-pages-artifact` (uses actions/upload-artifact under the hood).
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # GitHub sets NODE_ENV=production / NPM_CONFIG_PRODUCTION in many workflows;
      # plain `npm ci` then skips devDependencies → no `tsc`/`vite`. `--include=dev` is definitive.
      - name: Install dependencies
        run: npm ci --include=dev
      # Project site: /<repo>/ ; user site repo named *.github.io uses / .
      # (No `set -u`: npm child scripts can trip nounset on some runners.)
      - name: Build site for Pages
        env:
          NODE_ENV: production
        run: |
          set -eo pipefail
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export BASE_PATH=/
          else
            export BASE_PATH="/${REPO_NAME}/"
          fi
          echo "Building with BASE_PATH=${BASE_PATH}"
          npm run build:pages
      - name: Verify build output
        run: test -d dist && ls -la dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
