# Pushes the Vite `dist/` folder to branch `gh-pages` (reliable; no artifact/OIDC pipeline).
# In the repo: Settings → Pages → Build and deployment → Source: "Deploy from a branch"
# → Branch: gh-pages, folder: / (root). You only switch this once.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build static site
        env:
          NODE_ENV: production
        run: |
          set -eo pipefail
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export BASE_PATH=/
          else
            export BASE_PATH="/${REPO_NAME}/"
          fi
          echo "BASE_PATH=${BASE_PATH}"
          npm run build:pages

      - name: Push dist to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true
